#            Fichier exemple (à copier dans config.yaml)          #
#                                                                 #
#                                                                 #
#------------------------------------------------------------------

# API Tracker Draupnirr
tracker:
  # Domaines d'announce Draupnirr : un torrent QUI qui les porte est déjà sur Draupnirr
  tracker_urls: ["draupnirr.example"]
  # Adresse du site (les routes de l'API sont sous /api/)
  url: "https://draupnirr.example"
  # Jeton API (drp_...) créé dans Profil › Sécurité › Jetons API, ou ta passkey
  api_key: "drp_xxxxxxxxxxxx"

# API QUI (Autobrr)
qui:
  api_url: "http://exemple:7476/api"
  api_key: "xxxxxxxxxxxxxxxxx"
  instance_id: 1
  # Transformation des chemins (docker, mergerfs...) : chemin vu par qBittorrent -> chemin lu par ce script (mediainfo)
  # Ex: /test/... -> /serveur/storage/downloads/... Par défaut ne change pas.
  # Le cross-seed (savePath envoyé à QUI) garde toujours le chemin vu par qBittorrent.
  content_path_prefix: ""  # Préfixe à remplacer
  content_path_replacement: ""  # Nouveau préfixe
  upload_tag: "Auto_UP_Draupnirr"  # Tag des torrents remis en seed après upload

# API TMDB (optionnel) : la recherche passe par Draupnirr, la clé sert
# uniquement à lire les genres (documentaire, animation, concert)
tmdb:
  api_key: ""
  language: "fr-FR"

# Slugs de catégorie Draupnirr par type détecté (liste exacte : GET /api/categories)
# Vérifiés au démarrage : un slug inconnu affiche la liste des slugs valides
categories:
  movie: "films-film"
  tv: "series-serie-tv"
  documentary: "films-film"
  concert: "films-film"
  animated_movie: "films-film"
  animated_tv: "series-serie-tv"

# Options
options:
  page_size: 100  # Nombre de torrents par page
  nfo_signature: "NFO automatically Generated by: Draupnirr-AutoUploader"
  temp_dir: "./tmp/draupnirr-uploader"
  skip_no_team_prompt: true  # Si true, ne demande pas confirmation quand pas de team détectée
  auto_next_page: true  # Si true, passe automatiquement à la page suivante
  # N'afficher que ce qui manque sur Draupnirr
  #   false  : tout afficher
  #   "work" : l'œuvre manque, toutes qualités (série : pas de pack de la saison ni tous ses épisodes)
  #   "slot" : le slot visé est libre (une analyse Draupnirr par torrent avant la question)
  only_missing: false
